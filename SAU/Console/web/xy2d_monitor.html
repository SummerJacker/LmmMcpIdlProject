<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>XY2D 机器人监控（只读）</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    #headerBlock {
      flex: 0 0 auto;
      padding: 10px 14px;
      background: #fff;
      border-bottom: 1px solid #ddd;
    }
    #nlLabel { font-size: 12px; color: #666; }
    #nlText { font-size: 15px; font-weight: 600; margin-top: 4px; line-height: 1.35; max-height: 4.05em; overflow: hidden; }
    #phaseLabel { font-size: 12px; color: #666; margin-top: 10px; }
    #phaseText { font-size: 13px; color: #444; margin-top: 4px; line-height: 1.35; max-height: 4.05em; overflow: hidden; }
    #connStatus { font-size: 12px; color: #888; margin-top: 8px; }
    #connStatus.bad { color: #b71c1c; }
    #wrap {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      min-height: 480px;
    }
    #canvasHost {
      background: #fff;
      border: 1px solid #ccc;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    canvas { display: block; }
    #legend {
      position: absolute;
      font-size: 11px;
      color: #888;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="headerBlock">
    <div id="nlLabel">当前指令</div>
    <div id="nlText">—</div>
    <div id="phaseLabel">执行阶段</div>
    <div id="phaseText">—</div>
    <div id="connStatus" class="bad">未连接，等待主控推送…</div>
  </div>
  <div id="wrap">
    <div id="canvasHost" style="position:relative;">
      <canvas id="field" width="600" height="600"></canvas>
      <div id="legend" style="right:8px;bottom:8px;">范围 6m×6m | 推送 1Hz (SSE) | 只读</div>
    </div>
    <div id="mcpLogHost" style="margin-left: 20px; background: #fff; border: 1px solid #ccc; width: 450px; height: 600px; display: flex; flex-direction: column; box-shadow: 0 1px 3px rgba(0,0,0,.06);">
      <div style="padding: 10px; background: #fafafa; border-bottom: 1px solid #ddd; font-size: 13px; font-weight: 600; color: #444;">MCP 工具调用日志</div>
      <div id="mcpLogs" style="flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; white-space: pre-wrap; color: #333; line-height: 1.4;"></div>
    </div>
  </div>
  <script>
(function () {
  'use strict';

  /** 世界坐标范围（米） */
  var WORLD_MIN = -3;
  var WORLD_MAX = 3;
  var WORLD_SPAN = WORLD_MAX - WORLD_MIN;

  /** @type {HTMLCanvasElement} */
  var canvas = document.getElementById('field');
  /** @type {CanvasRenderingContext2D} */
  var ctx = canvas.getContext('2d');

  var elNl = document.getElementById('nlText');
  var elPhase = document.getElementById('phaseText');
  var elConn = document.getElementById('connStatus');
  var host = document.getElementById('canvasHost');

  var COLORS = ['#c62828', '#1565c0', '#2e7d32', '#6a1b9a', '#ef6c00', '#00838f'];

  /**
   * 弧度转角度（度）。
   * @param {number} rad   * @returns {number}
   */
  function toDeg(rad) {
    return rad * 180 / Math.PI;
  }

  /**
   * 世界坐标 → 画布像素（Y 轴向上为正）。
   * @param {number} wx
   * @param {number} wy
   * @param {number} plot 正方形绘图边长（px）
   * @param {number} pad 边距（px）
   * @returns {{x:number,y:number}}
   */
  function worldToScreen(wx, wy, plot, pad) {
    var u = (wx - WORLD_MIN) / WORLD_SPAN;
    var v = (WORLD_MAX - wy) / WORLD_SPAN;
    return { x: pad + u * plot, y: pad + v * plot };
  }

  /**
   * 根据容器尺寸调整画布：保持正方形绘图区居中。
   */
  function layoutCanvas() {
    var w = window.innerWidth - 20;
    var header = document.getElementById('headerBlock');
    var hAvail = window.innerHeight - header.offsetHeight - 20;
    var side = Math.max(320, Math.min(w, hAvail, 720));
    canvas.width = side;
    canvas.height = side;
    drawFrame(lastPayload);
  }

  /** @type {object|null} */
  var lastPayload = null;

  /**
   * 绘制整帧：网格、原点、机器人。
   * @param {object|null} data SSE JSON   */
  function drawFrame(data) {
    var w = canvas.width;
    var h = canvas.height;
    var pad = 28;
    var plot = Math.min(w, h) - 2 * pad;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#fafafa';
    ctx.fillRect(0, 0, w, h);

    ctx.save();
    ctx.strokeStyle = '#ddd';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    for (var g = WORLD_MIN; g <= WORLD_MAX; g++) {
      if (g === 0) continue;
      var a = worldToScreen(g, WORLD_MIN, plot, pad);
      var b = worldToScreen(g, WORLD_MAX, plot, pad);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      var c = worldToScreen(WORLD_MIN, g, plot, pad);
      var d = worldToScreen(WORLD_MAX, g, plot, pad);
      ctx.beginPath();
      ctx.moveTo(c.x, c.y);
      ctx.lineTo(d.x, d.y);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.strokeStyle = '#bbb';
    var ox0 = worldToScreen(0, WORLD_MIN, plot, pad);
    var ox1 = worldToScreen(0, WORLD_MAX, plot, pad);
    ctx.beginPath();
    ctx.moveTo(ox0.x, ox0.y);
    ctx.lineTo(ox1.x, ox1.y);
    ctx.stroke();
    var oy0 = worldToScreen(WORLD_MIN, 0, plot, pad);
    var oy1 = worldToScreen(WORLD_MAX, 0, plot, pad);
    ctx.beginPath();
    ctx.moveTo(oy0.x, oy0.y);
    ctx.lineTo(oy1.x, oy1.y);
    ctx.stroke();

    ctx.fillStyle = '#999';
    ctx.font = '10px system-ui,sans-serif';
    for (var t = WORLD_MIN; t <= WORLD_MAX; t++) {
      var p = worldToScreen(t, 0, plot, pad);
      ctx.fillText(String(t), p.x + 2, p.y + 12);
      var q = worldToScreen(0, t, plot, pad);
      ctx.fillText(String(t), q.x - 14, q.y - 4);
    }
    ctx.fillStyle = '#888';
    var o = worldToScreen(0, 0, plot, pad);
    ctx.fillText('O', o.x + 4, o.y - 4);
    ctx.restore();

    if (!data || !Array.isArray(data.robots)) return;

    data.robots.forEach(function (r, i) {
      var wx = r.x_m;
      var wy = r.y_m;
      var yaw = r.yaw_rad || 0;
      var p = worldToScreen(wx, wy, plot, pad);
      var color = COLORS[i % COLORS.length];

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(-yaw);
      ctx.fillStyle = color;
      ctx.beginPath();
      var R = 10;
      ctx.moveTo(R, 0);
      ctx.lineTo(-R * 0.6, R * 0.5);
      ctx.lineTo(-R * 0.6, -R * 0.5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();

      var ang = i * 0.85;
      var lx = p.x + 14 +18 * Math.cos(ang);
      var ly = p.y + 14 + 18 * Math.sin(ang);
      ctx.fillStyle = '#222';
      ctx.font = '12px system-ui,sans-serif';
      ctx.fillText(r.unit_id || '?', lx, ly);
      ctx.font = '10px system-ui,sans-serif';
      ctx.fillStyle = '#555';
      ctx.fillText('X:' + wx.toFixed(2) + 'm Y:' + wy.toFixed(2) + 'm', lx, ly + 14);
      ctx.fillText('\u03b8:' + toDeg(yaw).toFixed(1) + '\u00b0', lx, ly + 28);
    });
  }

  /**
   * 应用 SSE 载荷到文案与画布。
   * @param {object} d
   */
  function applyPayload(d) {
    lastPayload = d;
    elNl.textContent = d.natural_language || '';
    elPhase.textContent = d.phase_text || '';
    drawFrame(d);
    
    // 更新 MCP 日志
    if (d.mcp_logs) {
      var elLogs = document.getElementById('mcpLogs');
      if (elLogs) {
        var logText = d.mcp_logs.map(function(log) {
          return JSON.stringify(log);
        }).join(',\n');
        if (d.mcp_logs.length > 0) {
          logText = '[\n' + logText + '\n]';
        }
        elLogs.textContent = logText;
        elLogs.scrollTop = elLogs.scrollHeight;
      }
    }
  }

  var streamUrl = location.origin + '/debug/xy2d/stream';
  var es = new EventSource(streamUrl);

  es.onopen = function () {
    elConn.textContent = '已连接（SSE）';
    elConn.classList.remove('bad');
  };

  es.onmessage = function (ev) {
    try {
      var d = JSON.parse(ev.data);
      applyPayload(d);
    } catch (e) {
      console.warn('parse', e);
    }
  };

  es.onerror = function () {
    elConn.textContent = '连接中断，浏览器将自动重连…';
    elConn.classList.add('bad');
  };

  window.addEventListener('resize', layoutCanvas);
  layoutCanvas();
})();
  </script>
</body>
</html>
